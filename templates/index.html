<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Triage - Uca</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Gaya dasar sama seperti sebelumnya, Uca ringkas sedikit */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        :root { --primary-blue: #0056b3; --light-blue: #e6f2ff; --accent-blue: #007bff; --white: #ffffff; --text-dark: #333333; --text-gray: #666666; --bg-gray: #f4f7f6; }
        body { font-family: 'Nunito', sans-serif; background-color: var(--bg-gray); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .dashboard-container { background-color: var(--white); width: 100%; max-width: 800px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 86, 179, 0.1); overflow: hidden; }
        .header { background-color: var(--primary-blue); color: var(--white); padding: 30px 20px; text-align: center; position: relative; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .header .doctor-icon { font-size: 50px; margin-bottom: 15px; color: var(--light-blue); }
        .content { padding: 40px 30px; min-height: 350px; position: relative; }
        .question-section { display: none; animation: fadeIn 0.5s ease; }
        .question-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .question-title { color: var(--primary-blue); font-size: 20px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .question-desc { color: var(--text-gray); margin-bottom: 25px; }
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .option-btn { background-color: var(--light-blue); color: var(--primary-blue); border: 2px solid transparent; padding: 15px 10px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .option-btn i { font-size: 24px; }
        .option-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0, 123, 255, 0.2); }
        .option-btn.selected { background-color: var(--primary-blue); color: var(--white); border-color: var(--primary-blue); }
        .navigation { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 20px; border-top: 2px dashed var(--light-blue); }
        .nav-btn { padding: 12px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; border: none; }
        .btn-prev { background-color: transparent; color: var(--text-gray); border: 2px solid var(--text-gray); }
        .btn-next { background-color: var(--accent-blue); color: var(--white); }
        .btn-next:disabled { background-color: #cccccc; cursor: not-allowed; }
        .status-badge { display: inline-block; padding: 10px 30px; border-radius: 50px; font-size: 22px; font-weight: 800; color: var(--white); margin: 20px 0; }
        .status-1 { background-color: #dc3545; } /* Merah - Resusitasi/Gawat */
        .status-2 { background-color: #fd7e14; } /* Oranye - Emergent */
        .status-3 { background-color: #ffc107; color: #333; } /* Kuning - Urgent */
        .status-4 { background-color: #28a745; } /* Hijau - Less Urgent */
        .status-5 { background-color: #17a2b8; } /* Biru - Non Urgent */
        .progress-bar { height: 6px; background-color: rgba(255,255,255,0.3); width: 100%; position: absolute; bottom: 0; left: 0; }
        .progress-fill { height: 100%; background-color: var(--white); width: 0%; transition: width 0.4s; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <i class="fas fa-user-doctor doctor-icon"></i>
            <h1>Yuk ketahui tingkat kegawatdaruratan kamu!</h1>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>

        <div class="content">
            <div class="question-section active" id="step-1">
                <div class="question-title"><i class="fas fa-temperature-high"></i> 1. Suhu Tubuh</div>
                <div class="options-grid">
                    <button class="option-btn" onclick="selectOption(1, 'temperature', 35.5)"><i class="fas fa-snowflake"></i> &lt; 36°C</button>
                    <button class="option-btn" onclick="selectOption(1, 'temperature', 36.8)"><i class="fas fa-check"></i> 36°C - 37.5°C</button>
                    <button class="option-btn" onclick="selectOption(1, 'temperature', 38.5)"><i class="fas fa-fire"></i> &gt; 37.5°C</button>
                </div>
            </div>

            <div class="question-section" id="step-2">
                <div class="question-title"><i class="fas fa-heartbeat"></i> 2. Detak Jantung (BPM)</div>
                <div class="options-grid">
                    <button class="option-btn" onclick="selectOption(2, 'heartrate', 55)"><i class="fas fa-arrow-down"></i> Lambat (&lt;60)</button>
                    <button class="option-btn" onclick="selectOption(2, 'heartrate', 80)"><i class="fas fa-heart"></i> Normal (60-100)</button>
                    <button class="option-btn" onclick="selectOption(2, 'heartrate', 115)"><i class="fas fa-arrow-up"></i> Cepat (&gt;100)</button>
                </div>
            </div>

            <div class="question-section" id="step-3">
                <div class="question-title"><i class="fas fa-lungs"></i> 3. Pernapasan</div>
                <div class="options-grid">
                    <button class="option-btn" onclick="selectOption(3, 'resprate', 16)"><i class="fas fa-wind"></i> Normal</button>
                    <button class="option-btn" onclick="selectOption(3, 'resprate', 25)"><i class="fas fa-lungs-virus"></i> Agak Sesak</button>
                    <button class="option-btn" onclick="selectOption(3, 'resprate', 35)"><i class="fas fa-head-side-mask"></i> Sangat Sesak</button>
                </div>
            </div>

            <div class="question-section" id="step-4">
                <div class="question-title"><i class="fas fa-atom"></i> 4. Saturasi Oksigen (SpO2)</div>
                <div class="options-grid">
                    <button class="option-btn" onclick="selectOption(4, 'o2sat', 98)"><i class="fas fa-thumbs-up"></i> &gt; 95% (Aman)</button>
                    <button class="option-btn" onclick="selectOption(4, 'o2sat', 92)"><i class="fas fa-exclamation"></i> 90% - 95%</button>
                    <button class="option-btn" onclick="selectOption(4, 'o2sat', 85)"><i class="fas fa-triangle-exclamation"></i> &lt; 90% (Rendah)</button>
                </div>
            </div>

            <div class="question-section" id="step-5">
                <div class="question-title"><i class="fas fa-tint"></i> 5. Tensi Darah Atas (Sistolik)</div>
                <div class="options-grid">
                    <button class="option-btn" onclick="selectOption(5, 'sbp', 85)"><i class="fas fa-arrow-down"></i> Rendah (&lt;90)</button>
                    <button class="option-btn" onclick="selectOption(5, 'sbp', 110)"><i class="fas fa-check-circle"></i> Normal (90-120)</button>
                    <button class="option-btn" onclick="selectOption(5, 'sbp', 135)"><i class="fas fa-arrow-up"></i> Tinggi (&gt;120)</button>
                </div>
            </div>

            <div class="question-section" id="step-6">
                <div class="question-title"><i class="fas fa-tint-slash"></i> 6. Tensi Darah Bawah (Diastolik)</div>
                <div class="options-grid">
                    <button class="option-btn" onclick="selectOption(6, 'dbp', 55)"><i class="fas fa-arrow-down"></i> Rendah (&lt;60)</button>
                    <button class="option-btn" onclick="selectOption(6, 'dbp', 75)"><i class="fas fa-check-circle"></i> Normal (60-80)</button>
                    <button class="option-btn" onclick="selectOption(6, 'dbp', 95)"><i class="fas fa-arrow-up"></i> Tinggi (&gt;80)</button>
                </div>
            </div>

            <div class="question-section" id="step-7">
                <div class="question-title"><i class="fas fa-face-frown"></i> 7. Tingkat Nyeri</div>
                <div class="options-grid">
                    <button class="option-btn" onclick="selectOption(7, 'pain', 2)"><i class="fas fa-face-smile"></i> Ringan (0-3)</button>
                    <button class="option-btn" onclick="selectOption(7, 'pain', 5)"><i class="fas fa-face-meh"></i> Sedang (4-6)</button>
                    <button class="option-btn" onclick="selectOption(7, 'pain', 8)"><i class="fas fa-face-sad-tear"></i> Berat (7-10)</button>
                </div>
            </div>

            <div class="question-section" id="step-8" style="text-align: center;">
                <h2 style="color: var(--primary-blue);">Hasil Prediksi Model Decision Tree</h2>
                <div id="loading" style="display:none;"><i class="fas fa-spinner fa-spin fa-2x"></i><br>Menganalisis...</div>
                <div id="result-badge" class="status-badge"></div>
                <div id="recommendation-box" style="margin-top: 20px; text-align: left; background: var(--light-blue); padding: 15px; border-radius: 8px;"></div>
                <button class="nav-btn btn-next" style="margin-top: 30px;" onclick="location.reload()"><i class="fas fa-rotate-right"></i> Cek Ulang</button>
            </div>

            <div class="navigation" id="nav-container">
                <button class="nav-btn btn-prev" id="btn-prev" onclick="prevStep()" style="visibility: hidden;">Kembali</button>
                <button class="nav-btn btn-next" id="btn-next" onclick="nextStep()" disabled>Selanjutnya <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 7;
        
        // Objek untuk menampung data yang akan dikirim ke Python
        let patientData = {
            temperature: null, heartrate: null, resprate: null, 
            o2sat: null, sbp: null, dbp: null, pain: null
        };

        // Update progres awal
        document.getElementById('progress').style.width = `14%`;

        function selectOption(step, key, value) {
            const buttons = document.querySelectorAll(`#step-${step} .option-btn`);
            buttons.forEach(btn => btn.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            
            patientData[key] = value;
            document.getElementById('btn-next').disabled = false;
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                document.getElementById(`step-${currentStep}`).classList.remove('active');
                currentStep++;
                document.getElementById(`step-${currentStep}`).classList.add('active');
                
                document.getElementById('progress').style.width = `${(currentStep / totalSteps) * 100}%`;
                document.getElementById('btn-prev').style.visibility = 'visible';
                
                // Cek data di step selanjutnya
                const keys = Object.keys(patientData);
                if (patientData[keys[currentStep-1]] === null) {
                    document.getElementById('btn-next').disabled = true;
                }
                
                if (currentStep === totalSteps) {
                    document.getElementById('btn-next').innerHTML = 'Prediksi Acuity <i class="fas fa-robot"></i>';
                }
            } else if (currentStep === totalSteps) {
                submitToModel();
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                document.getElementById(`step-${currentStep}`).classList.remove('active');
                currentStep--;
                document.getElementById(`step-${currentStep}`).classList.add('active');
                
                document.getElementById('progress').style.width = `${(currentStep / totalSteps) * 100}%`;
                document.getElementById('btn-next').innerHTML = 'Selanjutnya <i class="fas fa-arrow-right"></i>';
                document.getElementById('btn-next').disabled = false;
                
                if (currentStep === 1) {
                    document.getElementById('btn-prev').style.visibility = 'hidden';
                }
            }
        }

        async function submitToModel() {
            document.getElementById('nav-container').style.display = 'none';
            document.getElementById(`step-${totalSteps}`).classList.remove('active');
            document.getElementById('step-8').classList.add('active');
            document.getElementById('loading').style.display = 'block';

            try {
                // Mengirim data ke Python Flask API
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(patientData)
                });
                
                const result = await response.json();
                document.getElementById('loading').style.display = 'none';
                
                const badge = document.getElementById('result-badge');
                const rec = document.getElementById('recommendation-box');
                
                // Mengolah hasil dari model (Acuity 1 - 5)
                const acuity = result.acuity;
                badge.className = `status-badge status-${acuity}`;
                
                if (acuity === 1) {
                    badge.innerText = 'ACUITY 1 (RESUSITASI)';
                    rec.innerHTML = '<b>Rekomendasi:</b> Pasien dalam kondisi kritis. Segera berikan penanganan gawat darurat (Merah)!';
                } else if (acuity === 2) {
                    badge.innerText = 'ACUITY 2 (EMERGENT)';
                    rec.innerHTML = '<b>Rekomendasi:</b> Risiko tinggi! Butuh evaluasi dokter segera dalam hitungan menit (Oranye).';
                } else if (acuity === 3) {
                    badge.innerText = 'ACUITY 3 (URGENT)';
                    rec.innerHTML = '<b>Rekomendasi:</b> Kondisi mendesak. Pasien membutuhkan beberapa sumber daya rumah sakit (Kuning).';
                } else if (acuity === 4) {
                    badge.innerText = 'ACUITY 4 (LESS URGENT)';
                    rec.innerHTML = '<b>Rekomendasi:</b> Kondisi stabil. Bisa menunggu dengan aman (Hijau).';
                } else {
                    badge.innerText = 'ACUITY 5 (NON URGENT)';
                    rec.innerHTML = '<b>Rekomendasi:</b> Tidak gawat. Pasien aman untuk berobat jalan (Biru).';
                }
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('recommendation-box').innerHTML = '<span style="color:red;">Gagal terhubung ke model. Pastikan file app.py sudah berjalan (Flask server hidup).</span>';
            }
        }
    </script>
</body>
</html>
